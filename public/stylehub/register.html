<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Your StyleHub Account | Register</title>
<meta name="description" content="Create a free StyleHub account to save your wishlist, store addresses, set size preferences and check out faster.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<header class="header" data-header></header>
<main>
 <div class="auth-wrap">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?auto=format&fit=crop&w=1200&q=80" alt="StyleHub menswear campaign photography">
    <div class="container"><p class="eyebrow" style="color:var(--gold-light)">Join StyleHub</p><h2 style="color:#fff">Membership has its privileges.</h2><p style="color:#d9d9e6;max-width:380px">Early access to drops, private sales, free returns and a wardrobe that remembers you.</p></div>
  </div>
  <div class="auth-form"><div class="inner">
    <h1 style="font-size:2rem">Create Account</h1>
    <p class="muted">It takes less than a minute.</p>
    <form id="registerForm" novalidate>
      <div class="field"><label for="name">Full Name</label><input id="name" name="name" autocomplete="name"><span class="err"></span></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err"></span></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" autocomplete="tel"><span class="err"></span></div>
      <div class="row-2">
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password"><span class="err"></span></div>
        <div class="field"><label for="confirm">Confirm Password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"><span class="err"></span></div>
      </div>
      <div class="field"><label class="check"><input type="checkbox" name="terms" id="terms"> I agree to the Terms of Service &amp; Privacy Policy</label><span class="err"></span></div>
      <button class="btn btn--pink btn--block" type="submit">Create Account</button>
      <p class="note note--err" id="registerMsg" style="display:none"></p>
    </form>
    <p style="margin-top:20px">Already registered? <a class="link-underline" style="color:var(--pink)" href="login.html">Sign in</a></p>
  </div></div>
 </div>
</main>
<footer class="footer" data-footer></footer>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
