<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login to Your Account | StyleHub</title>
<meta name="description" content="Sign in to your StyleHub account to track orders, manage addresses, save sizes and shop your wishlist.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<header class="header" data-header></header>
<main>
 <div class="auth-wrap">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&q=80" alt="StyleHub campaign photography">
    <div class="container"><p class="eyebrow" style="color:var(--gold-light)">Welcome back</p><h2 style="color:#fff">Your style, saved and waiting.</h2><p style="color:#d9d9e6;max-width:380px">Sign in to access your bag, wishlist, saved addresses and order history.</p></div>
  </div>
  <div class="auth-form"><div class="inner">
    <h1 style="font-size:2rem">Sign In</h1>
    <p class="muted">Enter your details to continue shopping.</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err"></span></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><span class="err"></span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <label class="check"><input type="checkbox" name="remember" id="remember"> Remember me</label>
        <button type="button" class="link-underline" id="forgot" style="background:none;border:none;cursor:pointer;color:var(--pink)">Forgot password?</button>
      </div>
      <button class="btn btn--pink btn--block" type="submit">Login</button>
      <p class="note note--err" id="loginMsg" style="display:none"></p>
    </form>
    <p style="margin-top:20px">Don't have an account? <a class="link-underline" style="color:var(--pink)" href="register.html">Create one</a></p>
  </div></div>
 </div>
</main>
<footer class="footer" data-footer></footer>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
